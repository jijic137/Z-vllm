[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "z-vllm"
version = "0.2.0"
authors = [{ name = "jijic137" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.57.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/jijic137/Z-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["zvllm*"]
